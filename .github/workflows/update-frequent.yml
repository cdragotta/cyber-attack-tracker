name: Update ransomware, alerts and news
on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore translation models
        uses: actions/cache@v4
        with:
          path: .argos-cache
          key: argos-${{ github.run_id }}
          restore-keys: argos-
      - name: Install translation engine
        run: |
          pip install --quiet ctranslate2 sentencepiece sacremoses langdetect
          pip install --quiet --no-deps argostranslate==1.11.0
      - name: Fetch, translate and build
        run: python scripts/tracker.py ransomware alerts news translate build
      - name: Commit data
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: ransomware, alerts, news $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
          git push

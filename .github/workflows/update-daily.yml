name: Update vulnerabilities (daily)
on:
  schedule:
    - cron: "43 5 * * *"   # daily 05:43 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and build
        run: python scripts/tracker.py vulns build
      - name: Commit data
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: vulnerabilities $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X ours origin main || true
          git push

name: Refresh EuRepoC history (quarterly)
on:
  schedule:
    - cron: "11 6 1 */3 *"   # quarterly
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and build
        run: python scripts/tracker.py eurepoc build
      - name: Commit data
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: EuRepoC history $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X ours origin main || true
          git push

name: Refresh EuRepoC history (quarterly)
on:
  schedule:
    - cron: "11 6 1 */3 *"   # quarterly; picked up by the next 2-hourly build
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/eurepoc.yml"]
permissions:
  contents: write
concurrency:
  group: eurepoc-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and build
        run: python scripts/tracker.py eurepoc
      - name: Commit data
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: EuRepoC history $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
          git push
